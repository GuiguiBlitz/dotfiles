# Enable true color support
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm*:Tc"

# Status Bar
set -g status-style 'bg=#6853B4,fg=#ffffff'
set -g status-left '#[fg=#CFCF00,bold] #S #[fg=#ffffff]| '
set -g status-right '#[fg=#ffffff]%Y-%m-%d #[fg=#CFCF00,bold]%H:%M '

# Window Titles
set -g window-status-style 'fg=#d1c4e9'
set -g window-status-current-style 'fg=#CFCF00,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' [#I:#W] '

# Panes (Inactive vs Active)
set -g window-style 'bg=#1c1926,fg=#b0b0b0'
set -g window-active-style 'bg=#252033,fg=#ffffff'

# Pane Borders
set -g pane-border-style 'fg=#6853B4,bg=#1c1926'
set -g pane-active-border-style 'fg=#CFCF00,bg=#252033'

# Messages & Selection
set -g message-style 'bg=#CFCF00,fg=#1c1926,bold'
set -g mode-style 'bg=#6853B4,fg=#ffffff,bold'

# Start window indexing at 1
set -g base-index 1

# Start pane indexing at 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Sync tmux copy buffer with system clipboard
set -s set-clipboard on

# Copy Mode
set -g mode-keys vi

# Prefer Wayland clipboard, fallback to X11 when available
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"; \
   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"; \
   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
